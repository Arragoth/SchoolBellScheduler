<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bell Scheduler</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
</head>
<body>
  <h1>Bell Scheduler</h1>
  <p style="text-align: center; font-size: 1rem; color: #555;">
    This scheduler is powered by Firebase. Your schedules will sync across devices automatically.
  </p>

  <div class="form-container">
    <label for="time">Select Time:</label>
    <input type="time" id="time" required>
    <label for="date">Select Date:</label>
    <input type="date" id="date">
    <br>
    <label>Repeat on:</label>
    <label><input type="checkbox" class="day-checkbox" value="Monday"> Mon</label>
    <label><input type="checkbox" class="day-checkbox" value="Tuesday"> Tue</label>
    <label><input type="checkbox" class="day-checkbox" value="Wednesday"> Wed</label>
    <label><input type="checkbox" class="day-checkbox" value="Thursday"> Thu</label>
    <label><input type="checkbox" class="day-checkbox" value="Friday"> Fri</label>
    <label><input type="checkbox" class="day-checkbox" value="Saturday"> Sat</label>
    <label><input type="checkbox" class="day-checkbox" value="Sunday"> Sun</label>
    <br>
    <label for="sound">Select Sound:</label>
    <select id="sound">
      <option value="bell.mp3">Bell</option>
      <option value="fire_alarm.mp3">Fire Alarm</option>
    </select>
    <button class="add-btn" onclick="addSchedule()">Add to Schedule</button>
  </div>

  <div id="scheduler">
    <h2>Control Scheduler</h2>
    <button class="control-btn" onclick="startScheduler()">Start Scheduler</button>
    <button class="control-btn" onclick="testBell()">Test Bell</button>
    <p id="status">Scheduler is not running.</p>
  </div>

  <div id="schedule">
    <h2>Scheduled Bells</h2>
    <p id="loadingMessage">Loading schedule...</p>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Date</th>
          <th>Days</th>
          <th>Sound</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="scheduleTable">
        <!-- Scheduled times will appear here -->
      </tbody>
    </table>
  </div>

  <audio id="bellSound" src="bell.mp3" preload="auto"></audio>
  <audio id="fireAlarmSound" src="fire_alarm.mp3" preload="auto"></audio>

  <script type="module" src="script.js"></script>
</body>
</html>
