<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bell Scheduler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
    #schedule {
      margin-top: 20px;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
      color: green;
    }
    .day-checkbox {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>Bell Scheduler</h1>
  <div>
    <label for="time">Select Time:</label>
    <input type="time" id="time" required>
    <label for="date">Select Date:</label>
    <input type="date" id="date">
    <br>
    <label>Repeat on:</label>
    <label><input type="checkbox" class="day-checkbox" value="Monday"> Mon</label>
    <label><input type="checkbox" class="day-checkbox" value="Tuesday"> Tue</label>
    <label><input type="checkbox" class="day-checkbox" value="Wednesday"> Wed</label>
    <label><input type="checkbox" class="day-checkbox" value="Thursday"> Thu</label>
    <label><input type="checkbox" class="day-checkbox" value="Friday"> Fri</label>
    <label><input type="checkbox" class="day-checkbox" value="Saturday"> Sat</label>
    <label><input type="checkbox" class="day-checkbox" value="Sunday"> Sun</label>
    <br>
    <label for="sound">Select Sound:</label>
    <select id="sound">
      <option value="bell.mp3">Bell</option>
      <option value="fire_alarm.mp3">Fire Alarm</option>
    </select>
    <button onclick="addSchedule()">Add to Schedule</button>
  </div>

  <div id="scheduler">
    <h2>Control Scheduler</h2>
    <button onclick="startScheduler()">Start Scheduler</button>
    <button onclick="testBell()">Test Bell</button>
    <p id="status">Scheduler is not running.</p>
  </div>

  <div id="schedule">
    <h2>Scheduled Bells</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Date</th>
          <th>Days</th>
          <th>Sound</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="scheduleTable">
        <!-- Scheduled times will appear here -->
      </tbody>
    </table>
  </div>

  <audio id="bellSound" src="bell.mp3" preload="auto"></audio>
  <audio id="fireAlarmSound" src="fire_alarm.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
